name: shan_reminder
description: A premium personal task and reminder app with selectable gold-accent themes.
publish_to: 'none'
version: 1.7.0+40

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  file_picker: 10.3.10
  share_plus: ^12.0.1
  google_sign_in: ^7.2.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
