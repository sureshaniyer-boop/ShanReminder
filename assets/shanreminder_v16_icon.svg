<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7183f"/><stop offset=".42" stop-color="#8d001d"/><stop offset="1" stop-color="#3f0010"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f62b4f"/><stop offset=".45" stop-color="#a60024"/><stop offset="1" stop-color="#5b0015"/></linearGradient>
