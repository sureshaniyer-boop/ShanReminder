name: Build Android APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Restore persistent ShanReminder signing identity
        id: signing_cache
        uses: actions/cache@v5
        with:
          path: ~/.android/shanreminder-signing
          key: shanreminder-release-signing-v1

      - name: Create signing identity on first v1.5 build
        if: ${{ steps.signing_cache.outputs['cache-hit'] != 'true' }}
        run: |
          mkdir -p ~/.android/shanreminder-signing
          PASS="$(openssl rand -hex 16)"
          printf '%s' "$PASS" > ~/.android/shanreminder-signing/password.txt
          keytool -genkeypair -v \
            -keystore ~/.android/shanreminder-signing/shanreminder-release.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias shanreminder \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ShanReminder, OU=Mobile, O=ShanReminder, L=Kuala Lumpur, ST=Kuala Lumpur, C=MY"

      - name: Export signing password
        run: echo "SHAN_SIGNING_PASSWORD=$(cat ~/.android/shanreminder-signing/password.txt)" >> "$GITHUB_ENV"

      - name: Create Android project shell
        run: |
          mkdir -p /tmp/shan_source
          cp -R lib /tmp/shan_source/lib
          cp pubspec.yaml /tmp/shan_source/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/shan_source/AndroidManifest.xml
          flutter create --platforms=android --org com.shanreminder --project-name shan_reminder build_app
          rm -rf build_app/lib
          rm -rf build_app/test
          cp -R /tmp/shan_source/lib build_app/lib
          cp -R test build_app/test
          cp /tmp/shan_source/pubspec.yaml build_app/pubspec.yaml
          cp /tmp/shan_source/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app/android/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace(
              "compileOptions {\n",
              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n",
              1,
          )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'

          signing = '''android {
    signingConfigs {
        create("shanRelease") {
            storeFile = file(System.getProperty("user.home") + "/.android/shanreminder-signing/shanreminder-release.jks")
            storePassword = System.getenv("SHAN_SIGNING_PASSWORD")
            keyAlias = "shanreminder"
            keyPassword = System.getenv("SHAN_SIGNING_PASSWORD")
        }
    }
'''
          text = text.replace("android {\n", signing, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("shanRelease")',
          )
          p.write_text(text)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze --no-fatal-infos

      - name: Check home layouts and generate previews
        working-directory: build_app
        run: flutter test --update-goldens test/home_layout_test.dart

      - name: Upload home previews
        uses: actions/upload-artifact@v4
        with:
          name: ShanReminder-Home-Previews
          path: build_app/test/previews/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShanReminder-v1.5-Android-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
