name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and verify permanent signing identity
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tools/prepare_signing.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android project shell
        run: |
          mkdir -p /tmp/shan_source
          cp -R lib /tmp/shan_source/lib
          cp pubspec.yaml /tmp/shan_source/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/shan_source/AndroidManifest.xml
          flutter create --platforms=android --org com.shanreminder --project-name shan_reminder build_app
          rm -rf build_app/lib
          rm -rf build_app/test
          cp -R /tmp/shan_source/lib build_app/lib
          cp -R test build_app/test
          cp /tmp/shan_source/pubspec.yaml build_app/pubspec.yaml
          cp /tmp/shan_source/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          python3 tools/configure_release_signing.py build_app/android/app/build.gradle.kts

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze --no-fatal-infos

      - name: Check home layouts and generate previews
        working-directory: build_app
        run: flutter test --update-goldens test/home_layout_test.dart

      - name: Upload home previews
        uses: actions/upload-artifact@v4
        with:
          name: ShanReminder-Home-Previews
          path: build_app/test/previews/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        working-directory: build_app
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: flutter build apk --release --build-number="$((100 + GITHUB_RUN_NUMBER))"

      - name: Verify APK signing certificate
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tools/verify_apk_signing.py build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShanReminder-signed-Android-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shan-release.p12"

